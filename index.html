<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KirKlin</title>
  <meta name="description" content="Board-level cardiac surgery MCQs for residents. Works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070c16" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KirKlin">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Bundled fonts (offline): fetch early so text never re-flows. -->
  <link rel="preload" href="fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-latin-wght.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/explanation.css">
  <link rel="stylesheet" href="css/annotate.css">
  <link rel="stylesheet" href="css/ink.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/review.css">
  <link rel="stylesheet" href="css/screen-player.css">
  <link rel="stylesheet" href="css/screen-home.css">
  <link rel="stylesheet" href="css/screen-misc.css">
  <link rel="stylesheet" href="css/book.css">

  <!-- Fetch the startup modules in parallel instead of one import at a time. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/core/events.js">
  <link rel="modulepreload" href="js/core/dom.js">
  <link rel="modulepreload" href="js/core/util.js">
  <link rel="modulepreload" href="js/core/settings.js">
  <link rel="modulepreload" href="js/core/router.js">
  <link rel="modulepreload" href="js/core/store/db.js">
  <link rel="modulepreload" href="js/core/store/repo.js">
  <link rel="modulepreload" href="js/ui/icons.js">
  <link rel="modulepreload" href="js/ui/components.js">
  <link rel="modulepreload" href="js/ui/shell.js">

  <noscript><style>.boot { display: none !important; }</style></noscript>

  <script type="module" src="js/app.js"></script>
</head>
<body aria-busy="true">
  <button type="button" class="skip-link">Skip to content</button>

  <!-- Boot splash: inline and request-free (the mark is a CSS mask in css/shell.css). -->
  <div id="boot" class="boot">
    <div class="boot-stage">
      <div class="boot-logo brand-badge" aria-hidden="true"><span class="brand-mark brand-mark--full"></span></div>
      <p class="boot-name">Kir<span class="wordmark-accent">Klin</span></p>
      <p class="boot-tagline">Cardiac surgery board review</p>
      <div class="boot-monitor" aria-hidden="true"><span class="ecg-line ecg-line--sweep"></span></div>
    </div>
    <p class="boot-slow">Still loading… <a href="./">Reload</a> or reopen the app.</p>
  </div>

  <header id="app-header" class="app-header"></header>

  <nav id="tabbar" class="tabbar" aria-label="Main">
    <a class="tab" href="#/" data-route="/" data-icon="home"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Home</span></a>
    <a class="tab" href="#/library" data-route="/library" data-icon="library"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Library</span></a>
    <a class="tab" href="#/book" data-route="/book" data-icon="book"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Book</span></a>
    <a class="tab" href="#/stats" data-route="/stats" data-icon="stats"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Stats</span></a>
    <a class="tab" href="#/search" data-route="/search" data-icon="search"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Search</span></a>
    <a class="tab" href="#/settings" data-route="/settings" data-icon="settings"><span class="tab-icon" aria-hidden="true"></span><span class="tab-label">Settings</span></a>
  </nav>

  <div id="banner-slot" class="banner-slot" aria-live="polite"></div>

  <main id="main" tabindex="-1"></main>

  <div id="toast-slot" class="toast-slot" aria-live="polite"></div>
  <div id="sheet-slot"></div>

  <noscript>
    <div class="noscript">
      <h1>KirKlin</h1>
      <p>This app needs JavaScript. Please turn it on in your browser settings, then reload the page.</p>
    </div>
  </noscript>
</body>
</html>
